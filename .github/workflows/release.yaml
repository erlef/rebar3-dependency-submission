---
name: Release

on:
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*
      - v[0-9]*.[0-9]*.[0-9]*-beta*

permissions:
  # For gh release
  contents: write
  # The following are for attestation purposes
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: setup-beam
        with:
          # Try to keep consistent with action.yaml and ci.yaml
          otp-version: 29.0.5
          rebar3-version: 3.27.0

      - name: Create Rebar3/Erlang script
        run: |
          git config \
            --global url."https://github.com/".insteadOf 'git@github.com:'
          rebar3 escriptize

      - name: Attest provenance
        id: attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _build/default/bin/rebar3_dependency_submission

      - name: Copy provenance
        run: |
          cp \
            "${{ steps.attest-provenance.outputs.bundle-path }}" \
            _build/default/bin/rebar3_dependency_submission.sigstore

      - name: Determine release type
        id: release-type
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest=true" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "latest=false" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create a GitHub release
        run: |
          gh release create \
            --generate-notes \
            --verify-tag \
            --latest="${{ steps.release-type.outputs.latest }}" \
            --prerelease="${{ steps.release-type.outputs.prerelease }}" \
            "${{ github.ref_name }}" \
            _build/default/bin/rebar3_dependency_submission*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
